
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar cliente | Mecánica JOYMAN</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="encabezado">
        <h1>MECÁNICA <span>JOYMAN</span></h1>
        <p>Editar información del cliente</p>
    </header>

    <main class="contenedor">

        <section class="seccion">
            <h2>Editar cliente</h2>

            {% with mensajes = get_flashed_messages(with_categories=true) %}
                {% for categoria, mensaje in mensajes %}
                    <div class="mensaje {{ categoria }}" role="status">
                        {{ mensaje }}
                    </div>
                {% endfor %}
            {% endwith %}

            <form method="POST"
                  action="{{ url_for('editar_cliente', cliente_id=cliente['id']) }}"
                  class="formulario">

                <div class="campo">
                    <label for="nombre">Nombre completo *</label>
                    <input type="text" id="nombre" name="nombre" maxlength="120" value="{{ cliente['nombre'] }}" required>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono *</label>
                    <input type="tel" id="telefono" name="telefono" maxlength="30" value="{{ cliente['telefono'] }}" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" maxlength="254" value="{{ cliente['correo'] or '' }}">
                </div>

                <div class="campo">
                    <label for="vehiculo">Vehículo</label>
                    <input type="text" id="vehiculo" name="vehiculo" maxlength="150" value="{{ cliente['vehiculo'] or '' }}">
                </div>

                <div class="campo campo-completo acciones">
                    <button type="submit" class="boton"> Guardar cambios </button>

                    <a href="{{ url_for('clientes') }}" class="boton-secundario"> Cancelar </a>
                </div>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Mecánica JOYMAN</p>
    </footer>

</body>
</html>
